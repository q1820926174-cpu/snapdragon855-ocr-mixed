services:
  ocr:
    image: snapdragon855-ocr-api:0.3.0
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "${OCR_BIND_ADDRESS:-127.0.0.1}:${OCR_PORT:-18081}:8000"
    devices:
      - /dev/kgsl-3d0:/dev/kgsl-3d0
    group_add:
      - "${VIDEO_GID:-44}"
    volumes:
      - ${OCR_MODELS:-./models/gpu-native}:/models:ro
      - /opt/scv41-mesa-kgsl:/opt/scv41-mesa-kgsl:ro
    environment:
      OCR_API_KEY: ${OCR_API_KEY:-}
      OCR_GPU_WORKERS: 2
      OCR_MAX_INFLIGHT: 10
      OCR_MAX_PENDING: 32
      OCR_REQUEST_TIMEOUT: 30
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
